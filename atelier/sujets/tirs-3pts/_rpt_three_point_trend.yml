version: 2

models:
  - name: rpt_three_point_trend
    description: "Mission 3, sujet libre : évolution du tir à 3 points par saison, sur les matchs de saison régulière avec box score (2010-2019). Une ligne par saison."
    columns:
      - name: season
        description: "Année de la saison (clé de la table)."
        data_tests: [unique, not_null]
      - name: games
        description: "Nombre de matchs avec box score."
        data_tests: [not_null]
      - name: fga3
        description: "Tirs à 3 points tentés (les deux équipes)."
        data_tests: [not_null]
      - name: fgm3
        description: "Tirs à 3 points réussis (les deux équipes)."
        data_tests: [not_null]
      - name: fga3_share
        description: "Part des tirs tentés qui sont des tirs à 3 points (entre 0 et 1)."
        data_tests: [not_null]
      - name: fg3_pct
        description: "Adresse à 3 points : réussis / tentés (entre 0 et 1)."
        data_tests: [not_null]
      - name: fga3_per_team_game
        description: "Tirs à 3 points tentés par équipe et par match."
        data_tests: [not_null]
