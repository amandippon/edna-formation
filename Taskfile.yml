version: '3'

vars:
  DBT_DIR: ./transformation
  SUPERSET_DIR: ./visualization
  SUPERSET_CONTAINER: superset
  DB_FILE: edna-sports-data.duckdb
  SUPERSET_DB_PATH: /app/superset_home/edna-sports-data.duckdb
  SUPERSET_DB_NAME: NCAA Basketball (DuckDB)
  PROJECT_DIR:
    sh: pwd

tasks:
  default:
    silent: true
    cmds:
      - task --list

  # ─────────────────────────────────────────────
  # Pipeline
  # ─────────────────────────────────────────────

  ingest:
    desc: "📥 CSV (resources/) -> Parquet (processed-resources/)"
    cmds:
      - uv run python ingestion/pipeline.py

  build:
    desc: "🏗️  dbt build : construit les modèles et lance les tests"
    dir: "{{.DBT_DIR}}"
    silent: true
    cmds:
      - |
        if ! uv run dbt build; then
          echo ""
          echo "🔴 Modèles ou tests en erreur."
          echo "   Au début d'une mission, les tests de la mission sont rouges : c'est attendu."
          echo "   « Parsing Error » ou « Compilation Error » : un fichier SQL ou YAML est mal écrit, regarde le fichier et la ligne indiqués."
          echo "   Détail d'un test de mission : task show M=mission_<n>_<modèle>"
          exit 1
        fi

  docs:
    desc: "📖 Génère la documentation dbt-colibri et la sert sur le port 8088 (Ctrl+C pour arrêter)"
    dir: "{{.DBT_DIR}}"
    cmds:
      - uv run dbt docs generate --quiet
      - uv run colibri generate --manifest target/manifest.json --catalog target/catalog.json --output-dir {{.PROJECT_DIR}}/colibri-docs
      - 'echo "📖 Documentation : http://localhost:8088 (dans VS Code : onglet PORTS)"'
      - python3 -m http.server 8088 --directory {{.PROJECT_DIR}}/colibri-docs

  show:
    desc: "🔎 Aperçu d'un modèle ou d'un test dbt, sans rien écrire dans la base (M=stg_tourney_seeds)"
    dir: "{{.DBT_DIR}}"
    silent: true
    vars:
      M: '{{.M | default ""}}'
    preconditions:
      - sh: '[ -n "{{.M}}" ]'
        msg: "❌ Usage : task show M=stg_tourney_seeds (un modèle) ou M=mission_1_stg_tourney_seeds (un test)"
    cmds:
      # Sortie JSON reformatée en tableau : l'affichage natif de dbt show coupe les textes à 20 caractères.
      - |
        uv run dbt show --select {{.M}} --limit 10 --quiet --output json | python3 -c '
        import json, sys
        raw = sys.stdin.read()
        if not raw.strip():
            print("❌ Rien à afficher pour {{.M}} : vérifie le nom du modèle ou du test (sans .sql)."); sys.exit(1)
        try:
            rows = json.loads(raw)["show"]
        except Exception:
            print(raw); sys.exit(1)
        if not rows:
            print("0 ligne."); sys.exit(0)
        cols = list(rows[0])
        val = lambda v: "null" if v is None else str(v)
        w = {c: max(len(c), *(len(val(r[c])) for r in rows)) for c in cols}
        print(" | ".join(c.ljust(w[c]) for c in cols))
        print("-+-".join("-" * w[c] for c in cols))
        for r in rows:
            print(" | ".join(val(r[c]).ljust(w[c]) for c in cols))
        print(f"({len(rows)} lignes affichées, 10 au plus)")
        '

  duckdb:
    desc: "🦆 Ouvre une copie de la base dans le terminal DuckDB (ne bloque pas dbt)"
    interactive: true
    preconditions:
      - sh: test -f {{.DB_FILE}}
        msg: "❌ Base absente. Lance d'abord : task ingest puis task build"
    cmds:
      # DuckDB verrouille le fichier dès qu'un process l'ouvre, même en lecture seule :
      # on travaille sur une copie pour que dbt puisse toujours écrire dans la vraie base.
      - cp {{.DB_FILE}} /tmp/edna-snapshot.duckdb
      - duckdb -readonly /tmp/edna-snapshot.duckdb

  # ─────────────────────────────────────────────
  # Atelier
  #   task step N=1   -> branche atelier/etape-1-staging    (mission 1 : stg_tourney_seeds)
  #   task step N=2   -> branche atelier/etape-2-marts      (mission 2 : dim_tourney_seeds)
  #   task step N=3   -> branche atelier/etape-3-reporting  (mission 3 : rpt_tourney_runs)
  #   task step N=4   -> branche atelier/etape-4-solution   (projet complet)
  # ─────────────────────────────────────────────

  step:
    desc: "🧭 Passe à l'étape N de l'atelier (1 à 4) : met le travail en cours dans git stash, change de branche, reconstruit la base"
    silent: true
    vars:
      N: '{{.N | default ""}}'
    preconditions:
      - sh: '[ "{{.N}}" = "1" ] || [ "{{.N}}" = "2" ] || [ "{{.N}}" = "3" ] || [ "{{.N}}" = "4" ]'
        msg: "❌ Usage : task step N=1 (staging), 2 (marts), 3 (reporting) ou 4 (solution)"
    cmds:
      - |
        case "{{.N}}" in
          1) B=atelier/etape-1-staging ;;
          2) B=atelier/etape-2-marts ;;
          3) B=atelier/etape-3-reporting ;;
          4) B=atelier/etape-4-solution ;;
        esac
        if [ -n "$(git status --porcelain)" ]; then
          git stash push --include-untracked -m "atelier : travail avant l'étape {{.N}}" > /dev/null
          echo "💾 Travail en cours rangé dans git stash (git stash list)."
        fi
        # Les exercices bonus (ignorés par git) dépendent de la couche reporting :
        # avant les étapes 1 et 2, on les met de côté pour ne pas casser le build.
        if [ "{{.N}}" -le 2 ] && [ -d {{.DBT_DIR}}/models/reporting/bonus -o -d {{.DBT_DIR}}/tests/bonus ]; then
          D=.atelier-sauvegarde/$(date +%H%M%S)
          mkdir -p "$D"
          mv {{.DBT_DIR}}/models/reporting/bonus "$D/models" 2>/dev/null || true
          mv {{.DBT_DIR}}/tests/bonus "$D/tests" 2>/dev/null || true
          echo "💾 Exercice bonus mis de côté dans $D"
        fi
        git fetch --quiet origin 2>/dev/null || echo "ℹ️  Pas de réseau : branches locales utilisées."
        git switch "$B" 2>/dev/null || git switch --track "origin/$B"
        echo "🧭 Étape {{.N}} : $B"
      # Les Parquet ne dépendent pas de l'étape : on ne relance l'ingestion que s'ils manquent.
      - |
        if [ -z "$(ls -A processed-resources 2>/dev/null)" ]; then
          echo "📥 Parquet absents : lancement de l'ingestion."
          task ingest
        fi
      - rm -f {{.DB_FILE}}
      - task: build

  bonus:
    desc: "🎯 Exercice bonus après la mission 3 : copie le squelette et ses tests (NAME=domicile|tirs-3pts|upsets)"
    silent: true
    vars:
      NAME: '{{.NAME | default ""}}'
    preconditions:
      - sh: '[ -n "{{.NAME}}" ] && [ -d "atelier/bonus/{{.NAME}}" ]'
        msg: "❌ Usage : task bonus NAME=domicile (ou tirs-3pts, ou upsets)"
    cmds:
      - |
        M={{.DBT_DIR}}/models/reporting/bonus; T={{.DBT_DIR}}/tests/bonus
        mkdir -p "$M" "$T"
        for f in atelier/bonus/{{.NAME}}/rpt_*.sql atelier/bonus/{{.NAME}}/_*.yml; do [ -e "$M/$(basename "$f")" ] || cp "$f" "$M/"; done
        for f in atelier/bonus/{{.NAME}}/assert_*.sql; do [ -e "$T/$(basename "$f")" ] || cp "$f" "$T/"; done
        echo "✏️  À compléter : transformation/models/reporting/bonus/$(basename atelier/bonus/{{.NAME}}/rpt_*.sql)"
        echo "   Puis : task build. Solution : atelier/solutions/"

  # ─────────────────────────────────────────────
  # Superset
  # ─────────────────────────────────────────────

  superset:up:
    desc: "🚀 Démarre Superset (port 8089) et y enregistre la base DuckDB"
    dir: "{{.SUPERSET_DIR}}"
    preconditions:
      - sh: test -f "{{.PROJECT_DIR}}/{{.DB_FILE}}"
        msg: "❌ Base {{.DB_FILE}} introuvable. Lance d'abord : task ingest puis task build"
      - sh: docker info > /dev/null 2>&1
        msg: "❌ Docker ne répond pas. Démarre Docker Desktop puis relance la commande."
    cmds:
      - docker compose build
      - docker compose up -d
      - echo "⏳ Attente du démarrage de Superset..."
      - |
        timeout=180; elapsed=0
        until docker exec {{.SUPERSET_CONTAINER}} curl -sf http://localhost:8088/health > /dev/null 2>&1; do
          sleep 5; elapsed=$((elapsed+5))
          if [ $elapsed -ge $timeout ]; then echo "❌ Superset n'a pas démarré après ${timeout}s (voir : docker logs superset)" && exit 1; fi
        done
      - docker cp {{.PROJECT_DIR}}/{{.DB_FILE}} {{.SUPERSET_CONTAINER}}:{{.SUPERSET_DB_PATH}}
      - docker exec {{.SUPERSET_CONTAINER}} superset db upgrade
      - docker exec {{.SUPERSET_CONTAINER}} superset fab create-admin --username admin --firstname Admin --lastname User --email admin@edna.fr --password admin || true
      - docker exec {{.SUPERSET_CONTAINER}} superset init
      - docker exec {{.SUPERSET_CONTAINER}} superset set-database-uri -d "{{.SUPERSET_DB_NAME}}" -u "duckdb:///{{.SUPERSET_DB_PATH}}?access_mode=read_only"
      - 'echo "✅ Superset : http://localhost:8089 depuis le navigateur de la machine hôte (admin / admin). Base : {{.SUPERSET_DB_NAME}}"'

  superset:sync:
    desc: "🔄 Recopie la base dans Superset et vide le cache des charts (après task build)"
    preconditions:
      - sh: docker ps --format '{{"{{"}}.Names{{"}}"}}' | grep -qx {{.SUPERSET_CONTAINER}}
        msg: "❌ Superset n'est pas démarré. Lance d'abord : task superset:up"
    cmds:
      - docker cp {{.PROJECT_DIR}}/{{.DB_FILE}} {{.SUPERSET_CONTAINER}}:{{.SUPERSET_DB_PATH}}
      - docker exec superset_cache redis-cli FLUSHALL > /dev/null
      - 'echo "✅ Base à jour dans Superset. Nouvelle table : Datasets > + Dataset. Table modifiée : Edit dataset > Sync columns from source."'

  superset:down:
    desc: "🛑 Arrête Superset (dashboards conservés)"
    dir: "{{.SUPERSET_DIR}}"
    cmds:
      - docker compose down

  # ─────────────────────────────────────────────
  # Diagnostic
  # ─────────────────────────────────────────────

  doctor:
    desc: "🩺 Vérifie Docker, la base DuckDB et Superset"
    silent: true
    cmds:
      - |
        ok=0
        if docker info > /dev/null 2>&1; then echo "✅ Docker joignable"; else echo "❌ Docker ne répond pas : démarre Docker Desktop"; ok=1; fi
        if [ -f "{{.PROJECT_DIR}}/{{.DB_FILE}}" ]; then echo "✅ Base {{.DB_FILE}} présente"; else echo "❌ Base {{.DB_FILE}} absente : task ingest puis task build"; ok=1; fi
        if docker ps --format '{{"{{"}}.Names{{"}}"}}' 2>/dev/null | grep -qx {{.SUPERSET_CONTAINER}}; then
          if docker exec {{.SUPERSET_CONTAINER}} curl -sf http://localhost:8088/health > /dev/null 2>&1; then
            echo "✅ Superset répond : http://localhost:8089 (admin / admin)"
          else
            echo "⏳ Superset démarre encore (ou erreur : docker logs superset)"; ok=1
          fi
        else
          echo "ℹ️  Superset arrêté : task superset:up pour le démarrer"
        fi
        exit $ok
