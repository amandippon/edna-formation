version: 2

models:
  - name: rpt_games
    description: "Tous les matchs (saison régulière + tournoi) dénormalisés avec noms d'équipes, ville hôte et analyse d'upsets. Une ligne par match, format gagnant/perdant. ~108k lignes. Pour une analyse centrée sur une équipe, préférer rpt_team_games."
    columns:
      - name: game_id
        description: "Identifiant unique du match (PK). Préfixé 'T_' pour les matchs de tournoi."
        data_tests: [unique, not_null]
      - name: game_type
        description: "Type de match : 'Regular' (saison régulière) ou 'Tournament' (tournoi NCAA)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Regular', 'Tournament']
      - name: season
        description: "Année de la saison."
      - name: season_label
        description: "Label lisible de la saison (ex: 'Season 2019')."
        data_tests: [not_null]
      - name: game_date
        description: "Date réelle du match."
        data_tests: [not_null]
      - name: w_team_name
        description: "Nom de l'équipe gagnante (ex: Connecticut, Tennessee)."
        data_tests: [not_null]
      - name: l_team_name
        description: "Nom de l'équipe perdante."
        data_tests: [not_null]
      - name: w_score
        description: "Points marqués par l'équipe gagnante."
      - name: l_score
        description: "Points marqués par l'équipe perdante."
      - name: score_margin
        description: "Écart de score (w_score - l_score). Toujours positif."
      - name: game_location
        description: "Lieu du match en clair : Home, Away ou Neutral."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Home', 'Away', 'Neutral']
      - name: has_overtime
        description: "Booléen : true si le match a eu au moins une prolongation."
      - name: is_close_game
        description: "Booléen : true si l'écart de score est de 5 points ou moins."
      - name: city
        description: "Nom de la ville hôte. Null si pas de données géographiques (avant 2010 ou données manquantes)."
      - name: state
        description: "Code état US de la ville hôte (ex: TX, CT). Null si pas de données géographiques."
      - name: state_iso
        description: "Code ISO 3166-2:US de la ville hôte (ex: US-TX). Compatible avec le chart type 'Country Map' de Superset (scope USA)."
      - name: w_seed_number
        description: "Seed de l'équipe gagnante au tournoi (1–16). Null pour les matchs de saison régulière."
      - name: l_seed_number
        description: "Seed de l'équipe perdante au tournoi. Null pour les matchs de saison régulière."
      - name: is_upset
        description: "Booléen : true si le gagnant avait un seed moins bon (plus élevé) que le perdant. Null pour la saison régulière."
      - name: upset_label
        description: "Catégorie d'upset basée sur l'écart de seed : 'Cinderella (10+ seeds)', 'Major Upset (5-9 seeds)', 'Upset (1-4 seeds)', 'Same Seed', 'Expected Result'. Null pour la saison régulière."

  - name: rpt_team_season_stats
    description: "Statistiques agrégées par équipe et par saison (saison régulière uniquement). Table clé pour les classements, tendances et cartes par état."
    columns:
      - name: team_name
        description: "Nom de l'équipe."
        data_tests: [not_null]
      - name: team_state
        description: "Code état US de l'équipe (ex: CT, TN). Déduit des matchs à domicile."
      - name: team_state_iso
        description: "Code ISO 3166-2:US de l'état de l'équipe (ex: US-CT). Pour les cartes Superset."
      - name: season
        description: "Année de la saison."
        data_tests: [not_null]
      - name: season_label
        description: "Label lisible de la saison (ex: 'Season 2019')."
      - name: games_played
        description: "Nombre total de matchs joués dans la saison (victoires + défaites)."
        data_tests: [not_null]
      - name: wins
        description: "Nombre de victoires en saison régulière."
      - name: losses
        description: "Nombre de défaites en saison régulière."
      - name: win_pct
        description: "Pourcentage de victoires (wins / games_played), arrondi à 3 décimales. Ex: 0.875 = 87.5%."
        data_tests: [not_null]
      - name: avg_pts_scored
        description: "Moyenne de points marqués par match, arrondie à 1 décimale."
      - name: avg_pts_allowed
        description: "Moyenne de points encaissés par match, arrondie à 1 décimale."
      - name: avg_pt_diff
        description: "Différence moyenne de points par match (pts marqués - pts encaissés). Positif = l'équipe marque plus qu'elle n'encaisse."
      - name: made_tourney
        description: "Booléen : true si l'équipe a été sélectionnée pour le tournoi NCAA cette saison."
      - name: tourney_seed_number
        description: "Numéro du seed au tournoi (1–16). Null si l'équipe n'a pas participé au tournoi."

  - name: rpt_tourney_runs
    description: "Parcours au tournoi NCAA par équipe et saison. Permet d'analyser les champions, Cinderella stories et la performance par seed."
    columns:
      - name: team_name
        description: "Nom de l'équipe."
        data_tests: [not_null]
      - name: team_state
        description: "Code état US de l'équipe."
      - name: team_state_iso
        description: "Code ISO 3166-2:US de l'état de l'équipe. Pour les cartes Superset."
      - name: season
        description: "Année de la saison du tournoi."
        data_tests: [not_null]
      - name: season_label
        description: "Label lisible de la saison."
        data_tests: [not_null]
      - name: seed_number
        description: "Numéro du seed de l'équipe au tournoi (1–16)."
        data_tests: [not_null]
      - name: tourney_wins
        description: "Nombre de victoires au tournoi (0 à 6). 6 = champion."
        data_tests: [not_null]
      - name: tourney_losses
        description: "Nombre de défaites au tournoi (0 ou 1, sauf pour le champion qui a 0)."
        data_tests: [not_null]
      - name: avg_pts_scored_tourney
        description: "Moyenne de points marqués par match au tournoi."
      - name: avg_pts_allowed_tourney
        description: "Moyenne de points encaissés par match au tournoi."
      - name: is_champion
        description: "Booléen : true si l'équipe a remporté le tournoi (6 victoires)."
        data_tests: [not_null]
      - name: tournament_result
        description: "Étape atteinte au tournoi : 'Champion' (6 wins), 'Runner-Up' (5), 'Final Four' (4), 'Elite Eight' (3), 'Sweet Sixteen' (2), 'Second Round' (1), 'First Round Exit' (0)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Champion', 'Runner-Up', 'Final Four', 'Elite Eight', 'Sweet Sixteen', 'Second Round', 'First Round Exit']

  - name: rpt_team_games
    description: "Une ligne par équipe et par match (saison régulière + tournoi NCAA), vue depuis l'équipe : chaque match apparaît deux fois (une ligne pour le gagnant, une pour le perdant). Table la plus souple pour Superset : un filtre sur team_name donne tout l'historique d'une équipe (victoires, points, lieu, box score) sans gérer le format gagnant/perdant. ~217k lignes."
    columns:
      - name: team_game_id
        description: "Identifiant unique de la ligne (PK) : game_id + '_' + team_id."
        data_tests: [unique, not_null]
      - name: game_id
        description: "Identifiant du match (deux lignes par game_id). Préfixé 'T_' pour les matchs de tournoi."
        data_tests: [not_null]
      - name: game_type
        description: "Type de match : 'Regular' (saison régulière) ou 'Tournament' (tournoi NCAA)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Regular', 'Tournament']
      - name: season
        description: "Année de la saison (ex: 2019 pour la saison 2018-2019)."
        data_tests: [not_null]
      - name: season_label
        description: "Label lisible de la saison (ex: 'Season 2019')."
      - name: game_date
        description: "Date réelle du match. Colonne temporelle à utiliser dans Superset."
        data_tests: [not_null]
      - name: team_id
        description: "Identifiant de l'équipe (point de vue de la ligne)."
        data_tests: [not_null]
      - name: team_name
        description: "Nom de l'équipe (ex: Connecticut, Tennessee)."
        data_tests: [not_null]
      - name: team_state
        description: "Code état US de l'équipe (ex: CT), déduit de ses matchs à domicile. Null pour quelques équipes sans match localisé."
      - name: team_state_iso
        description: "Code ISO 3166-2:US de l'état de l'équipe (ex: US-CT). Pour le chart 'Country Map' de Superset."
      - name: opponent_id
        description: "Identifiant de l'équipe adverse."
        data_tests: [not_null]
      - name: opponent_name
        description: "Nom de l'équipe adverse."
        data_tests: [not_null]
      - name: is_win
        description: "Booléen : true si l'équipe a gagné ce match."
        data_tests: [not_null]
      - name: result
        description: "Résultat en lettre : 'W' (victoire) ou 'L' (défaite)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['W', 'L']
      - name: pts_for
        description: "Points marqués par l'équipe."
      - name: pts_against
        description: "Points encaissés par l'équipe."
      - name: pt_diff
        description: "Écart de points signé (pts_for - pts_against) : positif en cas de victoire, négatif en cas de défaite."
      - name: team_location
        description: "Lieu du match du point de vue de l'équipe : 'Home' (à domicile), 'Away' (à l'extérieur) ou 'Neutral' (terrain neutre : environ la moitié des matchs de tournoi, les premiers tours se jouant souvent chez la tête de série)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Home', 'Away', 'Neutral']
      - name: num_ot
        description: "Nombre de prolongations (0 = temps réglementaire)."
      - name: has_overtime
        description: "Booléen : true si le match a eu au moins une prolongation."
      - name: is_close_game
        description: "Booléen : true si l'écart final est de 5 points ou moins."
      - name: city
        description: "Ville du match. Null avant 2010 (données villes disponibles à partir de la saison 2010)."
      - name: state
        description: "Code état US de la ville du match (ex: TX). Null avant 2010."
      - name: state_iso
        description: "Code ISO 3166-2:US de l'état du match (ex: US-TX). Pour le chart 'Country Map'. Null avant 2010."
      - name: team_seed
        description: "Seed de l'équipe au tournoi (1 = meilleur, 16 = moins bien classé). Null en saison régulière."
      - name: opponent_seed
        description: "Seed de l'adversaire au tournoi. Null en saison régulière."
      - name: is_upset_win
        description: "Booléen (tournoi) : true si l'équipe a gagné contre un adversaire mieux classé (seed plus faible). Null en saison régulière."
      - name: is_upset_loss
        description: "Booléen (tournoi) : true si l'équipe a perdu contre un adversaire moins bien classé. Null en saison régulière."
      - name: has_box_score
        description: "Booléen : true si le box score détaillé est disponible (saisons 2010 et suivantes)."
        data_tests: [not_null]
      - name: fgm
        description: "Tirs réussis (field goals made). Null sans box score."
      - name: fga
        description: "Tirs tentés (field goals attempted)."
      - name: fg_pct
        description: "Adresse aux tirs (fgm / fga), entre 0 et 1."
      - name: fgm3
        description: "Tirs à 3 points réussis."
      - name: fga3
        description: "Tirs à 3 points tentés."
      - name: fg3_pct
        description: "Adresse à 3 points (fgm3 / fga3), entre 0 et 1."
      - name: ftm
        description: "Lancers francs réussis."
      - name: fta
        description: "Lancers francs tentés."
      - name: ft_pct
        description: "Adresse aux lancers francs (ftm / fta), entre 0 et 1."
      - name: oreb
        description: "Rebonds offensifs."
      - name: dreb
        description: "Rebonds défensifs."
      - name: reb
        description: "Rebonds totaux (oreb + dreb). Null sans box score."
      - name: ast
        description: "Passes décisives."
      - name: tov
        description: "Balles perdues (turnovers)."
      - name: stl
        description: "Interceptions (steals)."
      - name: blk
        description: "Contres (blocks)."
      - name: pf
        description: "Fautes personnelles."
      - name: opp_fg_pct
        description: "Adresse aux tirs de l'adversaire, entre 0 et 1."
      - name: opp_fg3_pct
        description: "Adresse à 3 points de l'adversaire, entre 0 et 1."
      - name: opp_reb
        description: "Rebonds totaux de l'adversaire. Null sans box score."
      - name: opp_tov
        description: "Balles perdues de l'adversaire."
