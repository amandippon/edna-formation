  - name: rpt_uconn_tennessee_tourney
    description: "Performance au tournoi NCAA de Connecticut et Tennessee par saison. Seed, résultat final (Champion, Final Four, etc.), stats et box score détaillé. Pour comparer les parcours des deux rivales au tournoi."
    columns:
      - name: team_name
        description: "Nom de l'équipe : Connecticut ou Tennessee."
        data_tests: [not_null]
      - name: team_state
        description: "Code état US (CT ou TN)."
      - name: team_state_iso
        description: "Code ISO 3166-2:US."
      - name: season_label
        description: "Label lisible de la saison."
      - name: season
        description: "Année de la saison du tournoi."
        data_tests: [not_null]
      - name: seed_number
        description: "Seed au tournoi (1-16)."
      - name: seed_region
        description: "Région du bracket (W, X, Y, Z)."
      - name: tourney_games
        description: "Nombre de matchs joués au tournoi."
      - name: tourney_wins
        description: "Victoires au tournoi (0-6)."
      - name: tourney_losses
        description: "Défaites au tournoi."
      - name: tournament_result
        description: "Étape finale : Champion, Runner-Up, Final Four, Elite Eight, Sweet Sixteen, Second Round, First Round Exit."
        data_tests:
          - not_null
          - accepted_values:
              values: ['Champion', 'Runner-Up', 'Final Four', 'Elite Eight', 'Sweet Sixteen', 'Second Round', 'First Round Exit']
      - name: is_champion
        description: "Booléen : true si champion."
        data_tests: [not_null]
      - name: avg_pts_scored
        description: "Moyenne de points marqués au tournoi."
      - name: avg_pts_allowed
        description: "Moyenne de points encaissés au tournoi."
      - name: avg_pt_diff
        description: "Différence moyenne de points au tournoi."
      - name: upsets_involved
        description: "Nombre d'upsets impliquant cette équipe."
      - name: avg_fgm
        description: "Moyenne de field goals réussis par match au tournoi. Null avant 2010."
      - name: avg_fga
        description: "Moyenne de field goals tentés par match au tournoi. Null avant 2010."
      - name: fg_pct
        description: "% FG au tournoi."
      - name: avg_fgm3
        description: "Moyenne de 3-points réussis par match au tournoi. Null avant 2010."
      - name: avg_fga3
        description: "Moyenne de 3-points tentés par match au tournoi. Null avant 2010."
      - name: fg3_pct
        description: "% 3-points au tournoi."
      - name: avg_ftm
        description: "Moyenne de lancers francs réussis par match au tournoi. Null avant 2010."
      - name: avg_fta
        description: "Moyenne de lancers francs tentés par match au tournoi. Null avant 2010."
      - name: ft_pct
        description: "% LF au tournoi."
      - name: avg_reb
        description: "Moyenne de rebonds totaux par match au tournoi. Null avant 2010."
      - name: avg_off_reb
        description: "Moyenne de rebonds offensifs par match au tournoi. Null avant 2010."
      - name: avg_def_reb
        description: "Moyenne de rebonds défensifs par match au tournoi. Null avant 2010."
      - name: avg_ast
        description: "Moyenne de passes décisives par match au tournoi. Null avant 2010."
      - name: avg_tov
        description: "Moyenne de turnovers par match au tournoi. Null avant 2010."
      - name: avg_stl
