version: 2

models:
  - name: rpt_games
    description: "Tous les matchs (saison régulière + tournoi) dénormalisés. Table principale pour les dashboards Superset."
    columns:
      - name: game_id
        description: "Identifiant unique du match (PK)."
        data_tests: [unique, not_null]
      - name: game_type
        description: "Type de match : Regular ou Tournament."
        data_tests:
          - not_null
          - accepted_values:
              values: ['Regular', 'Tournament']
      - name: w_team_name
        data_tests: [not_null]
      - name: l_team_name
        data_tests: [not_null]
      - name: game_date
        data_tests: [not_null]
      - name: season_label
        data_tests: [not_null]
      - name: game_location
        data_tests:
          - not_null
          - accepted_values:
              values: ['Home', 'Away', 'Neutral']
      - name: state_iso
        description: "Code ISO 3166-2:US de la ville hôte (ex: US-TX). Pour les cartes Superset."

  - name: rpt_team_season_stats
    description: "Statistiques agrégées par équipe et par saison. Table clé pour les classements et tendances."
    columns:
      - name: team_name
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: team_state_iso
        description: "Code ISO 3166-2:US de l'état de l'équipe (ex: US-CT). Pour les cartes Superset."
      - name: games_played
        data_tests: [not_null]
      - name: win_pct
        data_tests: [not_null]

  - name: rpt_tourney_runs
    description: "Parcours au tournoi NCAA par équipe et saison. Championnats, brackets, avancement."
    columns:
      - name: team_name
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: team_state_iso
        description: "Code ISO 3166-2:US de l'état de l'équipe. Pour les cartes Superset."
      - name: tournament_result
        data_tests:
          - not_null
          - accepted_values:
              values: ['Champion', 'Runner-Up', 'Final Four', 'Elite Eight', 'Sweet Sixteen', 'Second Round', 'First Round Exit']
      - name: is_champion
        data_tests: [not_null]
