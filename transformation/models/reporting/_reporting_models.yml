  - name: rpt_uconn_tennessee_map
    description: "Coordonnées géographiques des campus de Connecticut (UConn, Storrs) et Tennessee (Knoxville). Pour chart deck.gl Scatter Plot ou Country Map sur Superset."
    columns:
      - name: team_name
        description: "Nom de l'équipe : Connecticut ou Tennessee."
        data_tests: [unique, not_null]
      - name: team_state
        description: "Code état US (CT ou TN)."
      - name: team_state_iso
