version: 2

models:
  - name: dim_teams
    description: "Dimension équipes NCAA Women avec état d'origine déduit des matchs à domicile."
    columns:
      - name: team_id
        description: "Identifiant unique de l'équipe (PK)."
        data_tests: [unique, not_null]
      - name: team_name
        data_tests: [not_null]
      - name: team_state
        description: "Code état US déduit de la ville où l'équipe joue le plus à domicile (ex: NC, CT)."
      - name: team_state_iso
        description: "Code ISO 3166-2:US pour les cartes Superset (ex: US-NC, US-CT)."

  - name: dim_seasons
    description: "Dimension saisons avec date de référence et labels lisibles."
    columns:
      - name: season
        description: "Année de la saison (PK)."
        data_tests: [unique, not_null]
      - name: day_zero
        data_tests: [not_null]
      - name: season_label
        data_tests: [not_null]

  - name: dim_cities
    description: "Dimension villes hôtes avec label combiné ville+état."
    columns:
      - name: city_id
        description: "Identifiant unique de la ville (PK)."
        data_tests: [unique, not_null]
      - name: city_state
        data_tests: [not_null]

  - name: fct_regular_season_games
    description: "Table de faits des matchs de saison régulière. 107k+ matchs, 1998-2019."
    columns:
      - name: game_id
        description: "Clé surrogate du match (PK)."
        data_tests: [unique, not_null]
      - name: season
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_seasons')
              field: season
      - name: w_team_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_teams')
              field: team_id
      - name: l_team_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_teams')
              field: team_id
      - name: game_date
        data_tests: [not_null]
      - name: w_score
        data_tests: [not_null]
      - name: l_score
        data_tests: [not_null]
      - name: game_location
        data_tests:
          - not_null
          - accepted_values:
              values: ['Home', 'Away', 'Neutral']

  - name: fct_tourney_games
    description: "Table de faits des matchs du tournoi NCAA. 1323 matchs, 1998-2018."
    columns:
      - name: game_id
        description: "Clé surrogate du match de tournoi (PK)."
        data_tests: [unique, not_null]
      - name: season
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_seasons')
              field: season
      - name: w_team_id
        data_tests: [not_null]
      - name: l_team_id
        data_tests: [not_null]
      - name: game_date
        data_tests: [not_null]
      - name: game_location
        data_tests:
          - not_null
          - accepted_values:
              values: ['Home', 'Away', 'Neutral']
