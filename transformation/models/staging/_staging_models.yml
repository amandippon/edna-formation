version: 2

models:
  - name: stg_teams
    description: "Référentiel des équipes NCAA Women Division I."
    columns:
      - name: team_id
        description: "Identifiant unique de l'équipe."
        data_tests: [unique, not_null]
      - name: team_name
        description: "Nom court de l'équipe."
        data_tests: [not_null]

  - name: stg_seasons
    description: "Référentiel des saisons avec date de référence DayZero."
    columns:
      - name: season
        description: "Année de la saison (ex: 2019 = saison 2018-19)."
        data_tests: [unique, not_null]
      - name: day_zero
        description: "Date de référence pour le calcul des dates de match (DayNum + DayZero)."
        data_tests: [not_null]

  - name: stg_cities
    description: "Référentiel des villes hôtes de matchs."
    columns:
      - name: city_id
        description: "Identifiant unique de la ville."
        data_tests: [unique, not_null]
      - name: city
        data_tests: [not_null]
      - name: state
        data_tests: [not_null]

  - name: stg_team_spellings
    description: "Variantes orthographiques des noms d'équipes."
    columns:
      - name: team_id
        data_tests: [not_null]
      - name: team_name_spelling
        data_tests: [not_null]

  - name: stg_tourney_seeds
    description: "Classements (seeds) des équipes au tournoi NCAA par saison."
    columns:
      - name: season
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: seed_raw
        data_tests: [not_null]
      - name: seed_region
        data_tests:
          - not_null
          - accepted_values:
              values: ['W', 'X', 'Y', 'Z']
      - name: seed_number
        data_tests: [not_null]

  - name: stg_tourney_slots
    description: "Structure des brackets du tournoi NCAA."
    columns:
      - name: slot
        data_tests: [unique, not_null]

  - name: stg_tourney_compact_results
    description: "Résultats des matchs du tournoi NCAA (tous, sans statistiques détaillées)."
    columns:
      - name: season
        data_tests: [not_null]
      - name: w_team_id
        data_tests: [not_null]
      - name: l_team_id
        data_tests: [not_null]
      - name: w_score
        data_tests: [not_null]
      - name: l_score
        data_tests: [not_null]
      - name: w_loc
        data_tests:
          - not_null
          - accepted_values:
              values: ['H', 'A', 'N']

  - name: stg_tourney_detailed_results
    description: "Résultats du tournoi NCAA avec statistiques complètes (box score)."
    columns:
      - name: season
        data_tests: [not_null]
      - name: w_team_id
        data_tests: [not_null]
      - name: l_team_id
        data_tests: [not_null]

  - name: stg_game_cities
    description: "Mapping matchs → ville hôte."
    columns:
      - name: season
        data_tests: [not_null]
      - name: w_team_id
        data_tests: [not_null]
      - name: l_team_id
        data_tests: [not_null]
      - name: city_id
        data_tests: [not_null]

  - name: stg_regular_season_compact_results
    description: "Résultats de tous les matchs de saison régulière (sans statistiques)."
    columns:
      - name: season
        data_tests: [not_null]
      - name: w_team_id
        data_tests: [not_null]
      - name: l_team_id
        data_tests: [not_null]
      - name: w_score
        data_tests: [not_null]
      - name: l_score
        data_tests: [not_null]
      - name: w_loc
        data_tests:
          - not_null
          - accepted_values:
              values: ['H', 'A', 'N']

  - name: stg_regular_season_detailed_results
    description: "Résultats de saison régulière avec statistiques complètes (box score)."
    columns:
      - name: season
        data_tests: [not_null]
      - name: w_team_id
        data_tests: [not_null]
      - name: l_team_id
        data_tests: [not_null]
