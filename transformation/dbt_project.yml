name: 'transformation'
version: '1.0.0'
config-version: 2

profile: 'edna-transformation'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  transformation:
    staging:
      +materialized: table
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
    reporting:
      +materialized: table
      +schema: reporting

# Sur les branches d'étape 1 et 2, les dossiers marts ou reporting sont absents :
# on masque l'avertissement « unused configuration paths », sans intérêt pour les participants.
flags:
  warn_error_options:
    silence:
      - UnusedResourceConfigPath
